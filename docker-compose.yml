services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OLLAMA_BASE_URL=http://100.85.83.23:11434
      - LLM_MODEL=${LLM_MODEL:-gemma3:12b}
      - CACHE_TTL_SECONDS=3600
      - CACHE_DIR=/app/.cache
      # Langfuse (leave empty to disable tracing)
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse-server:3000}
    volumes:
      - backend_cache:/app/.cache
    # depends_on:
    #   - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Langfuse self-hosted observability stack (PDF §6.2 + §7.2)
  # Start with:  docker compose --profile observability up
  # ---------------------------------------------------------------------------
  langfuse-db:
    image: postgres:15
    profiles: ["observability"]
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    restart: unless-stopped

  langfuse-server:
    image: langfuse/langfuse:2
    profiles: ["observability"]
    depends_on:
      - langfuse-db
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-prod}
      - SALT=${LANGFUSE_SALT:-change-me-in-prod}
      - NEXTAUTH_URL=http://localhost:3001
      - TELEMETRY_ENABLED=false
    restart: unless-stopped

  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   restart: unless-stopped

volumes:
  backend_cache:
  langfuse_db:
  # ollama_models:
