[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:langchain.*
markers =
    slow: marks tests that take more than ~1 second
    integration: marks tests that hit external services (skipped in CI)
